<!--
  Browser tab icon.

  A static file, because the browser fetches it directly and it cannot import
  from src/components/brand.tsx — so the tag outline and the "PE" below are a
  copy of ICON_TAG_PATH and PE_PATH from that module. Change one, change both.

  The mark is the clipped tag: a square with its bottom-right corner cut off.
  Letters are deliberately heavy — see the note on PE_PATH — because at 16px a
  thin counter disappears and "PE" turns into two dark smudges.
-->
