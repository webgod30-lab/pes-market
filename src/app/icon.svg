  <rect width="64" height="64" fill="#0b0f12"/>
  <path d="M3 3 H61 V45 L45 61 H3 Z" fill="#3ef2a0"/>
  <g fill="#0b0f12">
    <path d="M7 12 h7 v32 h-7 z M14 12 h13 v7 h-13 z M20 19 h7 v7 h-7 z M14 26 h13 v7 h-13 z"/>
    <path d="M33 12 h7 v32 h-7 z M40 12 h16 v7 h-16 z M40 24.5 h12 v7 h-12 z M40 37 h16 v7 h-16 z"/>
  </g>
</svg>
